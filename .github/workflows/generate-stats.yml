name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: General Profile Stats
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/github-stats.svg
          base: header, activity, repositories
          theme: dark
          config_timezone: Asia/Kolkata

      # Card 2: Top Languages
      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/top-langs.svg
          base: "" # Hides the basic stats to focus ONLY on languages
          theme: dark
          plugin_languages: yes
          plugin_languages_indepth: yes # Scans your actual commits to find languages!
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 6
